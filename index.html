<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>StrongTrack 5x5</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #111;
            --card: #1e1e1e;
            --card2: #252525;
            --accent: #f57c00;
            --accent-dim: #bf6000;
            --text: #f0f0f0;
            --text-dim: #888;
            --success: #4caf50;
            --fail: #f44336;
            --border: #333;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        .header {
            background: var(--card);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 1.2rem; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
        .header-badge {
            background: var(--accent);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
            letter-spacing: 0.5px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            z-index: 100;
        }
        .nav-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background: none;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: color 0.2s;
        }
        .nav-btn.active { color: var(--accent); }
        .nav-btn svg { width: 22px; height: 22px; }

        .tab { display: none; padding: 16px; }
        .tab.active { display: block; }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .card-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .workout-info { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .workout-badge {
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 8px;
        }
        .workout-date {
            background: var(--card2);
            color: var(--text-dim);
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
        }

        .exercise-card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }
        .exercise-card.completed { border-color: var(--success); }
        .exercise-card.failed { border-color: var(--fail); }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }
        .exercise-name { font-size: 1.05rem; font-weight: 700; }
        .exercise-weight { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
        .exercise-meta { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
        .pr-badge {
            font-size: 0.62rem;
            background: gold;
            color: #333;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            margin-left: 6px;
            vertical-align: middle;
        }

        .sets-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .set-btn {
            flex: 1;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--card2);
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            min-width: 46px;
            min-height: 46px;
        }
        .set-btn.done { background: var(--success); border-color: var(--success); color: #fff; }
        .set-btn.missed { background: var(--fail); border-color: var(--fail); color: #fff; }

        .plates { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .plate-chip {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 0.72rem;
            color: var(--text-dim);
        }
        .plate-chip span { color: var(--text); font-weight: 600; }

        .timer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            z-index: 200;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }
        .timer-overlay.show { display: flex; }
        .timer-label-top { color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; }
        .timer-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid var(--accent);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent);
        }
        .timer-sub { font-size: 0.72rem; color: var(--text-dim); margin-top: 4px; }
        .timer-skip {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
        }

        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 14px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            letter-spacing: 0.5px;
            transition: background 0.2s;
            display: block;
        }
        .btn:hover { background: var(--accent-dim); }
        .btn:disabled { background: #444; cursor: not-allowed; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .btn-danger { background: var(--fail); }
        .btn-danger:hover { background: #c62828; }
        .mt-8 { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }

        .history-item {
            background: var(--card);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item.success { border-left: 4px solid var(--success); }
        .history-item.partial { border-left: 4px solid orange; }
        .history-item.incomplete { border-left: 4px solid var(--fail); }
        .history-date { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 2px; }
        .history-exercises { font-size: 0.73rem; color: var(--text-dim); margin-top: 4px; line-height: 1.5; }

        .chart-container { position: relative; height: 190px; margin-bottom: 4px; }
        .exercise-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
        .ex-tab {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card2);
            color: var(--text-dim);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ex-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .stat-card { background: var(--card2); border-radius: 10px; padding: 14px; text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }
        .setting-row:last-child { border-bottom: none; }
        .setting-label { font-size: 0.9rem; font-weight: 500; }
        .setting-desc { font-size: 0.73rem; color: var(--text-dim); margin-top: 2px; }
        .setting-control input[type="number"] {
            background: var(--card2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 8px;
            width: 90px;
            font-size: 0.9rem;
            text-align: center;
        }

        select {
            background: var(--card2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .weight-editor { display: grid; gap: 8px; }
        .weight-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card2);
            border-radius: 8px;
            padding: 10px 14px;
        }
        .weight-row span { font-size: 0.9rem; }
        .weight-row input {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 10px;
            border-radius: 6px;
            width: 80px;
            font-size: 0.9rem;
            text-align: center;
        }

        .complete-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 300;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            text-align: center;
            padding: 24px;
        }
        .complete-overlay.show { display: flex; }
        .complete-icon { font-size: 4rem; }
        .complete-title { font-size: 1.8rem; font-weight: 700; }
        .complete-subtitle { color: var(--text-dim); font-size: 0.9rem; max-width: 280px; }
        .complete-stats { display: flex; gap: 28px; margin: 6px 0; }
        .complete-stat { text-align: center; }
        .complete-stat-val { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
        .complete-stat-lbl { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; }

        .empty { text-align: center; padding: 40px 20px; color: var(--text-dim); }
        .empty-icon { font-size: 3rem; margin-bottom: 12px; }

        .deload-warn {
            background: rgba(244,67,54,0.1);
            border: 1px solid var(--fail);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.8rem;
            color: #ef9a9a;
            margin-bottom: 12px;
        }

        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    </style>
</head>
<body>

<div class="header">
    <h1>⚡ STRONGTRACK 5x5</h1>
    <span class="header-badge" id="streakBadge">0 SESSIONS</span>
</div>

<!-- WORKOUT TAB -->
<div class="tab active" id="tab-workout">
    <div id="workoutContent"></div>
</div>

<!-- HISTORY TAB -->
<div class="tab" id="tab-history">
    <div class="stats-grid" id="statsGrid"></div>
    <div id="historyList"></div>
</div>

<!-- PROGRESS TAB -->
<div class="tab" id="tab-progress">
    <div class="exercise-tabs" id="progressTabs"></div>
    <div class="card">
        <div class="card-title" id="progressTitle">SQUAT</div>
        <div class="chart-container">
            <canvas id="progressChart"></canvas>
        </div>
        <div id="progressStats"></div>
    </div>
</div>

<!-- SETTINGS TAB -->
<div class="tab" id="tab-settings">
    <div class="card">
        <div class="card-title">GENERAL</div>
        <div class="setting-row">
            <div>
                <div class="setting-label">Units</div>
                <div class="setting-desc">Weight measurement</div>
            </div>
            <select id="unitsSelect" onchange="saveSetting('units', this.value)">
                <option value="lbs">LBS</option>
                <option value="kg">KG</option>
            </select>
        </div>
        <div class="setting-row">
            <div>
                <div class="setting-label">Rest Timer</div>
                <div class="setting-desc">Seconds between sets</div>
            </div>
            <div class="setting-control">
                <input type="number" id="restTimeInput" value="90" min="30" max="300"
                    onchange="saveSetting('restTime', +this.value)">
            </div>
        </div>
        <div class="setting-row">
            <div>
                <div class="setting-label">Bar Weight</div>
                <div class="setting-desc">Your barbell weight</div>
            </div>
            <div class="setting-control">
                <input type="number" id="barWeightInput" value="45" min="0" max="55"
                    onchange="saveSetting('barWeight', +this.value)">
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">WORKING WEIGHTS</div>
        <div class="weight-editor" id="weightEditor"></div>
        <button class="btn mt-12" onclick="saveWeights()">SAVE WEIGHTS</button>
    </div>

    <div class="card">
        <div class="card-title">SCHEDULE</div>
        <div class="setting-row">
            <div>
                <div class="setting-label">Next Workout</div>
                <div class="setting-desc">Toggle A / B manually</div>
            </div>
            <select id="nextWorkoutSelect" onchange="setNextWorkout(this.value)">
                <option value="A">Workout A</option>
                <option value="B">Workout B</option>
            </select>
        </div>
    </div>

    <div class="card">
        <div class="card-title">DANGER ZONE</div>
        <button class="btn btn-danger" onclick="confirmReset()">RESET ALL DATA</button>
    </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <button class="nav-btn active" onclick="showTab('workout', this)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/></svg>
        Workout
    </button>
    <button class="nav-btn" onclick="showTab('history', this)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        History
    </button>
    <button class="nav-btn" onclick="showTab('progress', this)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>
        Progress
    </button>
    <button class="nav-btn" onclick="showTab('settings', this)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
        Settings
    </button>
</nav>

<!-- REST TIMER OVERLAY -->
<div class="timer-overlay" id="timerOverlay">
    <div class="timer-label-top">REST</div>
    <div class="timer-circle" id="timerCircle">
        <span id="timerDisplay">90</span>
        <span class="timer-sub">seconds</span>
    </div>
    <button class="timer-skip" onclick="skipTimer()">Skip Rest ›</button>
</div>

<!-- WORKOUT COMPLETE OVERLAY -->
<div class="complete-overlay" id="completeOverlay">
    <div class="complete-icon">🏆</div>
    <div class="complete-title">WORKOUT DONE!</div>
    <div class="complete-stats" id="completeStats"></div>
    <div class="complete-subtitle" id="completeSubtitle"></div>
    <button class="btn" onclick="closeComplete()" style="max-width:280px;margin-top:8px;">BACK TO HOME</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ── DATA ─────────────────────────────────────────────────────────────────────

const WORKOUTS = {
    A: [
        { id: 'squat',   name: 'Squat',         sets: 5, reps: 5, increment: 5 },
        { id: 'bench',   name: 'Bench Press',    sets: 5, reps: 5, increment: 5 },
        { id: 'row',     name: 'Barbell Row',    sets: 5, reps: 5, increment: 5 },
    ],
    B: [
        { id: 'squat',    name: 'Squat',          sets: 5, reps: 5, increment: 5 },
        { id: 'ohp',      name: 'Overhead Press', sets: 5, reps: 5, increment: 5 },
        { id: 'deadlift', name: 'Deadlift',       sets: 1, reps: 5, increment: 10 },
    ]
};

const ALL_EX = ['squat','bench','row','ohp','deadlift'];
const EX_NAMES = { squat:'Squat', bench:'Bench Press', row:'Barbell Row', ohp:'Overhead Press', deadlift:'Deadlift' };

function defaultState() {
    return {
        nextWorkout: 'A',
        exercises: {
            squat:    { weight: 45, failures: 0, pr: 45 },
            bench:    { weight: 45, failures: 0, pr: 45 },
            row:      { weight: 45, failures: 0, pr: 45 },
            ohp:      { weight: 45, failures: 0, pr: 45 },
            deadlift: { weight: 45, failures: 0, pr: 45 },
        },
        history: [],
        settings: { units: 'lbs', restTime: 90, barWeight: 45 },
    };
}

let state = loadState();
let session = null;
let timerInterval = null;
let timerSec = 0;
let progressChart = null;
let selEx = 'squat';

function loadState() {
    try { const s = localStorage.getItem('st5x5_v1'); if (s) return JSON.parse(s); } catch(e) {}
    return defaultState();
}
function saveState() { localStorage.setItem('st5x5_v1', JSON.stringify(state)); }

// ── BOOT ─────────────────────────────────────────────────────────────────────

window.addEventListener('load', () => {
    renderWorkout();
    renderSettings();
    updateBadge();
});

// ── NAV ──────────────────────────────────────────────────────────────────────

function showTab(name, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
    if (name === 'history')  renderHistory();
    if (name === 'progress') renderProgress();
    if (name === 'settings') renderSettings();
    if (name === 'workout')  renderWorkout();
}

// ── WORKOUT VIEW ─────────────────────────────────────────────────────────────

function renderWorkout() {
    const el = document.getElementById('workoutContent');
    const u  = state.settings.units;

    if (!session) {
        const wt  = state.nextWorkout;
        const exs = WORKOUTS[wt];
        let html  = `<div class="workout-info">
            <div class="workout-badge">WORKOUT ${wt}</div>
            <div class="workout-date">${fmtDate(new Date())}</div>
        </div>`;

        exs.forEach(ex => {
            const exSt  = state.exercises[ex.id];
            const isPR  = exSt.weight >= exSt.pr && exSt.pr > 45;
            const plates = calcPlates(exSt.weight, state.settings.barWeight);
            const warn  = exSt.failures === 2 ? `<div class="deload-warn">⚠️ One more fail = 10% deload</div>` : '';

            html += `
            <div class="exercise-card">
                ${warn}
                <div class="exercise-header">
                    <div>
                        <div class="exercise-name">${ex.name}${isPR ? '<span class="pr-badge">PR</span>':''}</div>
                        <div class="exercise-meta">${ex.sets} × ${ex.reps} reps &nbsp;·&nbsp; +${ex.increment}${u}/session</div>
                    </div>
                    <div class="exercise-weight">${exSt.weight} ${u}</div>
                </div>
                <div class="plates">
                    <div class="plate-chip">Bar <span>${state.settings.barWeight}${u}</span></div>
                    ${plates.map(p => `<div class="plate-chip"><span>${p}${u}</span> × 2</div>`).join('')}
                    ${plates.length === 0 ? '<div class="plate-chip" style="color:var(--text-dim)">No plates needed</div>' : ''}
                </div>
            </div>`;
        });

        const last = getLastOfType(wt);
        if (last) {
            html += `<div class="card" style="font-size:.78rem;color:var(--text-dim);">
                Last ${wt}: ${fmtDateShort(new Date(last.date))} —
                ${last.exercises.map(e => e.name.split(' ')[0]+' '+e.weight+u).join(', ')}
            </div>`;
        }

        html += `<button class="btn" onclick="startWorkout()">START WORKOUT ${wt}</button>`;
        el.innerHTML = html;

    } else {
        let html = `<div class="workout-info">
            <div class="workout-badge">WORKOUT ${session.type} — ACTIVE</div>
            <div class="workout-date">${fmtDate(new Date())}</div>
        </div>`;

        session.exercises.forEach((ex, ei) => {
            const allDone   = ex.sets.every(s => s !== null);
            const allPassed = ex.sets.every(s => s === true);
            const cls = allDone ? (allPassed ? 'completed' : 'failed') : '';
            const plates = calcPlates(ex.weight, state.settings.barWeight);
            const u = state.settings.units;

            html += `
            <div class="exercise-card ${cls}">
                <div class="exercise-header">
                    <div>
                        <div class="exercise-name">${ex.name}</div>
                        <div class="exercise-meta">${ex.totalSets} × ${ex.reps} reps</div>
                    </div>
                    <div class="exercise-weight">${ex.weight} ${u}</div>
                </div>
                <div class="sets-row">
                    ${ex.sets.map((s, si) => {
                        const cls = s === true ? 'done' : s === false ? 'missed' : '';
                        return `<button class="set-btn ${cls}" onclick="toggleSet(${ei},${si})">${si+1}</button>`;
                    }).join('')}
                </div>
                <div class="plates">
                    <div class="plate-chip">Bar <span>${state.settings.barWeight}${u}</span></div>
                    ${plates.map(p => `<div class="plate-chip"><span>${p}${u}</span> × 2</div>`).join('')}
                </div>
            </div>`;
        });

        const ready = session.exercises.every(ex => ex.sets.every(s => s !== null));
        html += `
        <button class="btn" ${ready?'':'disabled'} onclick="finishWorkout()">
            ${ready ? 'FINISH WORKOUT ✓' : 'Mark All Sets First'}
        </button>
        <button class="btn btn-outline mt-8" onclick="cancelWorkout()">Cancel Workout</button>`;

        el.innerHTML = html;
    }
}

// ── WORKOUT LOGIC ─────────────────────────────────────────────────────────────

function startWorkout() {
    const wt = state.nextWorkout;
    session = {
        type: wt,
        startTime: Date.now(),
        exercises: WORKOUTS[wt].map(ex => ({
            id: ex.id,
            name: ex.name,
            weight: state.exercises[ex.id].weight,
            totalSets: ex.sets,
            reps: ex.reps,
            sets: Array(ex.sets).fill(null),
        }))
    };
    renderWorkout();
}

function toggleSet(ei, si) {
    const ex = session.exercises[ei];
    const cur = ex.sets[si];

    if (cur === null) {
        ex.sets[si] = true;
        const lastSet = si === ex.sets.length - 1;
        const lastEx  = ei === session.exercises.length - 1;
        if (!(lastSet && lastEx)) startTimer();
    } else if (cur === true) {
        ex.sets[si] = false;
        stopTimer();
        document.getElementById('timerOverlay').classList.remove('show');
    } else {
        ex.sets[si] = null;
    }
    renderWorkout();
}

function finishWorkout() {
    const newPRs = [];
    session.exercises.forEach(ex => {
        const passed = ex.sets.filter(s => s === true).length;
        const success = passed === ex.totalSets;
        const exSt = state.exercises[ex.id];

        if (success) {
            if (ex.weight > exSt.pr) { exSt.pr = ex.weight; newPRs.push(ex.name); }
            exSt.failures = 0;
            const def = Object.values(WORKOUTS).flat().find(e => e.id === ex.id);
            exSt.weight = snap(exSt.weight + (def ? def.increment : 5));
        } else {
            exSt.failures++;
            if (exSt.failures >= 3) {
                exSt.weight = snap(exSt.weight * 0.9);
                exSt.failures = 0;
            }
        }
    });

    const entry = {
        id: Date.now(),
        date: new Date().toISOString(),
        workout: session.type,
        duration: Math.round((Date.now() - session.startTime) / 60000),
        exercises: session.exercises.map(ex => ({
            id: ex.id,
            name: ex.name,
            weight: ex.weight,
            sets: ex.sets,
            completed: ex.sets.every(s => s === true),
        }))
    };

    state.history.unshift(entry);
    state.nextWorkout = session.type === 'A' ? 'B' : 'A';
    saveState();
    stopTimer();
    showComplete(entry, newPRs);
    session = null;
    updateBadge();
}

function cancelWorkout() {
    if (confirm('Cancel this workout? Progress will be lost.')) {
        session = null;
        stopTimer();
        document.getElementById('timerOverlay').classList.remove('show');
        renderWorkout();
    }
}

function showComplete(entry, newPRs) {
    const total = entry.exercises.length;
    const done  = entry.exercises.filter(e => e.completed).length;
    const vol   = entry.exercises.reduce((s, ex) => s + ex.sets.filter(x => x === true).length * 5 * ex.weight, 0);

    document.getElementById('completeStats').innerHTML = `
        <div class="complete-stat"><div class="complete-stat-val">${done}/${total}</div><div class="complete-stat-lbl">Exercises</div></div>
        <div class="complete-stat"><div class="complete-stat-val">${entry.duration}m</div><div class="complete-stat-lbl">Duration</div></div>
        <div class="complete-stat"><div class="complete-stat-val">${(vol/1000).toFixed(1)}k</div><div class="complete-stat-lbl">Volume</div></div>
    `;
    document.getElementById('completeSubtitle').innerHTML = newPRs.length
        ? `🎉 New PRs: ${newPRs.join(', ')}!`
        : `Next up: Workout ${state.nextWorkout}`;
    document.getElementById('completeOverlay').classList.add('show');
}

function closeComplete() {
    document.getElementById('completeOverlay').classList.remove('show');
    renderWorkout();
}

// ── REST TIMER ────────────────────────────────────────────────────────────────

function startTimer() {
    stopTimer();
    timerSec = state.settings.restTime;
    document.getElementById('timerOverlay').classList.add('show');
    tick();
    timerInterval = setInterval(() => {
        timerSec--;
        tick();
        if (timerSec <= 0) {
            stopTimer();
            document.getElementById('timerOverlay').classList.remove('show');
            beep();
        }
    }, 1000);
}

function tick() {
    const m = Math.floor(timerSec / 60);
    const s = timerSec % 60;
    document.getElementById('timerDisplay').textContent =
        m > 0 ? `${m}:${String(s).padStart(2,'0')}` : timerSec;
}

function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
function skipTimer() { stopTimer(); document.getElementById('timerOverlay').classList.remove('show'); }

function beep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.15, 0.3].forEach(t => {
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.frequency.value = 880; o.type = 'sine';
            g.gain.setValueAtTime(0.25, ctx.currentTime + t);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.12);
            o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.13);
        });
    } catch(e) {}
}

// ── PLATES ────────────────────────────────────────────────────────────────────

function calcPlates(total, bar) {
    const SIZES = [45, 35, 25, 10, 5, 2.5];
    let rem = Math.round(((total - bar) / 2) * 10) / 10;
    const out = [];
    for (const p of SIZES) while (rem >= p - 0.01) { out.push(p); rem = Math.round((rem - p) * 10) / 10; }
    return out;
}

function snap(w) { return Math.round(w / 2.5) * 2.5; }

// ── HISTORY ───────────────────────────────────────────────────────────────────

function renderHistory() {
    const u = state.settings.units;
    const n = state.history.length;
    const vol = state.history.reduce((s, h) =>
        s + h.exercises.reduce((es, ex) => es + ex.sets.filter(x => x === true).length * 5 * ex.weight, 0), 0);
    const best = getBestPR();

    document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="stat-value">${n}</div><div class="stat-label">Sessions</div></div>
        <div class="stat-card"><div class="stat-value">${calcStreak()}</div><div class="stat-label">Week Streak</div></div>
        <div class="stat-card"><div class="stat-value">${(vol/1000).toFixed(0)}k</div><div class="stat-label">Total Volume</div></div>
        <div class="stat-card"><div class="stat-value">${best.weight}${u}</div><div class="stat-label">${best.name} PR</div></div>
    `;

    if (!n) {
        document.getElementById('historyList').innerHTML =
            `<div class="empty"><div class="empty-icon">📋</div><div>No workouts yet.<br>Start your first session!</div></div>`;
        return;
    }

    document.getElementById('historyList').innerHTML = state.history.map(entry => {
        const allDone  = entry.exercises.every(e => e.completed);
        const someDone = entry.exercises.some(e => e.completed);
        const cls = allDone ? 'success' : someDone ? 'partial' : 'incomplete';
        const icon = allDone ? '✅' : someDone ? '⚠️' : '❌';
        const summary = entry.exercises.map(ex => {
            const done = ex.sets.filter(s => s === true).length;
            return `${ex.name.split(' ')[0]} ${ex.weight}${u} (${done}/${ex.sets.length})`;
        }).join(' · ');

        return `<div class="history-item ${cls}">
            <div style="flex:1">
                <div class="history-date">${fmtDateShort(new Date(entry.date))} · ${entry.duration ?? '?'}min</div>
                <div style="font-weight:600;font-size:.9rem;">Workout ${entry.workout}</div>
                <div class="history-exercises">${summary}</div>
            </div>
            <div style="font-size:1.4rem;margin-left:8px;">${icon}</div>
        </div>`;
    }).join('');
}

function calcStreak() {
    let streak = 0;
    const now = new Date();
    for (let w = 0; w < 52; w++) {
        const ws = new Date(now); ws.setDate(now.getDate() - w * 7 - now.getDay());
        const we = new Date(ws); we.setDate(ws.getDate() + 7);
        const count = state.history.filter(h => { const d = new Date(h.date); return d >= ws && d < we; }).length;
        if (count >= 3) streak++;
        else if (w > 0) break;
    }
    return streak;
}

function getBestPR() {
    let best = { name: 'Squat', weight: state.exercises.squat.pr };
    ALL_EX.forEach(id => { if (state.exercises[id].pr > best.weight) best = { name: EX_NAMES[id], weight: state.exercises[id].pr }; });
    return best;
}

function getLastOfType(t) { return state.history.find(h => h.workout === t) || null; }

// ── PROGRESS ──────────────────────────────────────────────────────────────────

function renderProgress() {
    document.getElementById('progressTabs').innerHTML = ALL_EX.map(id =>
        `<button class="ex-tab ${id===selEx?'active':''}" onclick="pickEx('${id}')">${EX_NAMES[id].split(' ')[0]}</button>`
    ).join('');
    drawChart(selEx);
}

function pickEx(id) { selEx = id; renderProgress(); }

function drawChart(id) {
    document.getElementById('progressTitle').textContent = EX_NAMES[id].toUpperCase();
    const u = state.settings.units;
    const pts = [...state.history].reverse()
        .filter(h => h.exercises.some(e => e.id === id))
        .map(h => {
            const ex = h.exercises.find(e => e.id === id);
            return { label: fmtDateShort(new Date(h.date)), weight: ex.weight, ok: ex.completed };
        });

    const cur = state.exercises[id];
    document.getElementById('progressStats').innerHTML = `
        <div style="display:flex;gap:20px;margin-top:12px;flex-wrap:wrap;">
            <div><span style="font-size:.72rem;color:var(--text-dim);">WORKING</span><br><strong>${cur.weight}${u}</strong></div>
            <div><span style="font-size:.72rem;color:var(--text-dim);">PR</span><br><strong style="color:var(--accent)">${cur.pr}${u}</strong></div>
            <div><span style="font-size:.72rem;color:var(--text-dim);">SESSIONS</span><br><strong>${pts.length}</strong></div>
            <div><span style="font-size:.72rem;color:var(--text-dim);">FAILS</span><br><strong style="color:${cur.failures>0?'var(--fail)':'inherit'}">${cur.failures}/3</strong></div>
        </div>`;

    if (progressChart) { progressChart.destroy(); progressChart = null; }
    if (!pts.length) return;

    const ctx = document.getElementById('progressChart').getContext('2d');
    progressChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: pts.map(p => p.label),
            datasets: [{
                data: pts.map(p => p.weight),
                borderColor: '#f57c00',
                backgroundColor: 'rgba(245,124,0,0.08)',
                borderWidth: 2.5,
                pointBackgroundColor: pts.map(p => p.ok ? '#f57c00' : '#f44336'),
                pointRadius: 5,
                tension: 0.35,
                fill: true,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: c => ` ${c.raw}${u}` } }
            },
            scales: {
                x: { ticks: { color:'#777', font:{size:10}, maxRotation:40 }, grid:{color:'#2a2a2a'} },
                y: { ticks: { color:'#777', font:{size:10} }, grid:{color:'#2a2a2a'} }
            }
        }
    });
}

// ── SETTINGS ──────────────────────────────────────────────────────────────────

function renderSettings() {
    const s = state.settings;
    document.getElementById('unitsSelect').value       = s.units;
    document.getElementById('restTimeInput').value     = s.restTime;
    document.getElementById('barWeightInput').value    = s.barWeight;
    document.getElementById('nextWorkoutSelect').value = state.nextWorkout;
    document.getElementById('weightEditor').innerHTML  = ALL_EX.map(id => `
        <div class="weight-row">
            <span>${EX_NAMES[id]}</span>
            <input type="number" id="w_${id}" value="${state.exercises[id].weight}" min="0" step="2.5">
        </div>`).join('');
}

function saveSetting(k, v) { state.settings[k] = v; saveState(); }

function saveWeights() {
    ALL_EX.forEach(id => {
        const v = parseFloat(document.getElementById('w_' + id).value);
        if (!isNaN(v) && v > 0) state.exercises[id].weight = v;
    });
    saveState();
    renderWorkout();
    alert('Weights saved!');
}

function setNextWorkout(v) { state.nextWorkout = v; saveState(); renderWorkout(); }

function confirmReset() {
    if (confirm('Reset ALL data? This cannot be undone.')) {
        if (confirm('Last chance — are you sure?')) {
            localStorage.removeItem('st5x5_v1');
            state = defaultState();
            session = null;
            renderWorkout();
            renderSettings();
            updateBadge();
        }
    }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────

function fmtDate(d) { return d.toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' }); }
function fmtDateShort(d) { return d.toLocaleDateString('en-US', { month:'short', day:'numeric' }); }
function updateBadge() {
    const n = state.history.length;
    document.getElementById('streakBadge').textContent = `${n} SESSION${n !== 1 ? 'S' : ''}`;
}
</script>
